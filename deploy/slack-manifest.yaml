# Slack app manifest for dancer. Create the app at
# https://api.slack.com/apps → "Create New App" → "From a manifest" → paste this.
display_information:
  name: dancer
  description: Orchestrates coding agents from Slack
  background_color: "#1f2937"
features:
  bot_user:
    display_name: dancer
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - files:write
      - channels:history
      - groups:history
      - im:history
      - im:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
