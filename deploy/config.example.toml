# dancer configuration. Default location: ~/.config/dancer/config.toml
# (override with -config or $DANCER_CONFIG). Create one with `dancer setup`.

[server]
db = "/home/me/.config/dancer/dancer.db"
workdir_root = "/home/me/.config/dancer/work"   # per-task dirs for definitions without a fixed workdir
idle_timeout = "10m"        # keep a finished turn's process alive this long for follow-ups
drain_timeout = "2m"        # on restart, let in-flight tool calls finish before stopping agents
verbose = false             # true: post every tool call to the thread
default_agent = "coder"     # used by `run <prompt>` without an agent name
transports = ["slack"]      # "slack", "terminal"
auto_resume = true          # after a restart, continue cut-short tasks without waiting for a reply
auto_resume_within = "12h"  # skip tasks last touched longer ago than this
max_auto_resumes = 3        # consecutive automatic resumes of one task before it waits for a human
# resume_prompt = "Continue where you left off."   # what an auto-resumed session is told

[claude]
binary = "claude"

# --- decider (optional) ------------------------------------------------------
# A small model that answers dancer's judgement calls; see DECIDER.md. Off by
# default: dancer's own rules decide, and they are also the fallback whenever
# the decider fails, times out or answers something outside the options.

[decider]
kind = "off"                # off | claude
model = "haiku"
uses = ["resume"]           # question kinds it may answer: resume, permission; [] = never asked
timeout = "15s"
max_per_task = 20           # questions one task may cost before the rules take over
# Ceiling for permission decisions: tool calls the decider may approve without
# asking you. Same syntax as a definition's allowed_tools. Empty (the default)
# means every permission prompt still reaches you, whatever the decider thinks.
auto_allow = []             # e.g. ["Read", "Glob", "Grep", "Bash(go test:*)"]

[slack]
app_token = "xapp-..."      # App-level token with connections:write
bot_token = "xoxb-..."      # Bot User OAuth token
allowed_users = []          # Slack user IDs allowed to command dancer; empty = everyone

# --- per-channel defaults ----------------------------------------------------
# Plain messages in a channel run its default agent instead of
# server.default_agent. `@dancer default <agent>` appends one of these; when a
# channel appears more than once the last block wins.

[[channels]]
id = "C0123ABCDEF"          # Slack channel id (channel details → "Channel ID")
agent = "sandbox"

# --- agent definitions -------------------------------------------------------

[[definitions]]
name = "coder"
model = "sonnet"
permission_mode = "manual"                 # manual | acceptEdits | auto | bypassPermissions
allowed_tools = ["Read", "Glob", "Grep", "Edit", "Write", "Bash(git:*)"]
system_prompt = "You are working inside a git repository. Commit when done."
[definitions.environment]
kind = "local"
workdir = "/home/me/projects/app"          # empty = fresh dir under workdir_root per task

[[definitions]]
name = "sandbox"
model = "sonnet"
permission_mode = "acceptEdits"
[definitions.environment]
kind = "docker"
image = "ghcr.io/you/claude-dev:latest"    # must contain the `claude` binary
workdir = ""                               # host dir mounted at /work; empty = per-task dir
[definitions.environment.env]
CLAUDE_CODE_OAUTH_TOKEN = "sk-ant-oat01-..."   # or ANTHROPIC_API_KEY; the container has no ~/.claude login

[[definitions]]
name = "buildbox"
model = "sonnet"
permission_mode = "manual"
[definitions.environment]
kind = "ssh"
host = "me@buildbox"                       # user@host or a ~/.ssh/config alias
key_path = ""                              # empty = ssh agent / config
workdir = "/srv/work/app"
