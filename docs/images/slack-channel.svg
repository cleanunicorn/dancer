<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Slack channel with dispatch task threads</title>
  <desc id="desc">A sanitized Slack channel screenshot showing dispatch task threads marked as running, waiting and idle.</desc>
  <defs>
