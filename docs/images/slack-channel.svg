  <text x="92" y="164" font-family="Arial, sans-serif" font-size="15" fill="#d8bfd9">Channels</text>
  <rect x="82" y="184" width="230" height="34" rx="6" fill="#1164a3"/>
  <text x="102" y="207" font-family="Arial, sans-serif" font-size="16" fill="#ffffff"># dispatch</text>
  <text x="102" y="250" font-family="Arial, sans-serif" font-size="16" fill="#e8d7e8"># backend</text>
  <text x="102" y="291" font-family="Arial, sans-serif" font-size="16" fill="#e8d7e8"># review-queue</text>
  <text x="102" y="332" font-family="Arial, sans-serif" font-size="16" fill="#e8d7e8"># incidents</text>
  <text x="92" y="396" font-family="Arial, sans-serif" font-size="15" fill="#d8bfd9">Direct messages</text>
  <text x="102" y="438" font-family="Arial, sans-serif" font-size="16" fill="#e8d7e8">dispatch</text>
  <rect x="336" y="54" width="804" height="72" fill="#ffffff"/>
  <line x1="336" y1="126" x2="1140" y2="126" stroke="#ddd8df"/>
  <text x="369" y="99" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1d1c1d"># dispatch</text>
  <text x="496" y="99" font-family="Arial, sans-serif" font-size="14" fill="#616061">task threads for agent work</text>

  <g font-family="Arial, sans-serif">
