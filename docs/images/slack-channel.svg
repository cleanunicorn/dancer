    <circle cx="386" cy="426" r="18" fill="#8a63d2"/>
    <text x="381" y="433" font-size="18" font-weight="700" fill="#ffffff">A</text>
    <text x="418" y="420" font-size="15" font-weight="700" fill="#1d1c1d">Ari</text>
    <text x="450" y="420" font-size="13" fill="#616061">10:28 AM</text>
