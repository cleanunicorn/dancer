    <text x="418" y="545" font-size="15" font-weight="700" fill="#1d1c1d">Jules</text>
    <text x="464" y="545" font-size="13" fill="#616061">10:41 AM</text>
    <text x="418" y="570" font-size="16" fill="#1d1c1d">@dispatch tighten the web auth tests</text>
    <rect x="418" y="588" width="64" height="28" rx="14" fill="#f8f8f8" stroke="#ddd8df"/>
